version: 2
updates:
  # This section configures Dependabot to update npm dependencies.
  - package-ecosystem: "npm"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR per group below, plus one PR per major bump outside the groups,
    # so a breaking release only blocks its own PR (see /dependabot-update).
    # The limit counts every open npm PR; a group PR counts as one.
    open-pull-requests-limit: 15
    versioning-strategy: increase
    commit-message:
      prefix: "[yarn]"
    assignees:
      - "vitalii-pustovyi"
    groups:
      # A package goes to the first group it matches.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      nx-major:
        update-types:
          - "major"
        patterns:
          - "nx"
          - "@nx/*"
      e2e-tooling-major:
        update-types:
          - "major"
        patterns:
          - "@wdio/*"
          - "webdriverio"
          - "expect-webdriverio"
          - "eslint-plugin-wdio"
          - "geckodriver"
          - "chromedriver"
          - "@cucumber/*"
      storybook-major:
        update-types:
          - "major"
        patterns:
          - "storybook"
          - "@storybook/*"
          - "eslint-plugin-storybook"
      babel-major:
        update-types:
          - "major"
        patterns:
          - "@babel/*"
          - "babel-loader"
      typescript-eslint-major:
        update-types:
          - "major"
        patterns:
          - "@typescript-eslint/*"
      react-major:
        update-types:
          - "major"
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      jest-major:
        update-types:
          - "major"
        patterns:
          - "jest"
          - "jest-*"
          - "ts-jest"
          - "@types/jest"
      walletconnect-major:
        update-types:
          - "major"
        patterns:
          - "@walletconnect/*"
          - "@reown/*"
      lifi-major:
        update-types:
          - "major"
        patterns:
          - "@lifi/*"
      icp-major:
        update-types:
          - "major"
        patterns:
          - "@dfinity/*"
          - "@icp-sdk/*"
      radix-major:
        update-types:
          - "major"
        patterns:
          - "@radix-ui/*"
      eslint-major:
        update-types:
          - "major"
        patterns:
          - "eslint"
          - "@eslint/*"
      # No catch-all major group: every other major bump gets its own PR.
      # Add a group above only for packages that must move together (lockstep
      # releases or strict peers); /dependabot-update suggests new ones.
    ignore:
      - dependency-name: "@icp-sdk/core"
      - dependency-name: "@icp-sdk/auth"

  # This section configures Dependabot to update GitHub Actions dependencies.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "[github-actions]"
    assignees:
      - "olsemeno"
    groups:
      dependencies:
        patterns:
          - "*"

  # This section configures Dependabot to update Docker dependencies.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "[docker]"
    assignees:
      - "olsemeno"
    groups:
      dependencies:
        patterns:
          - "*"
