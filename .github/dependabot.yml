version: 2
updates:
  # This section configures Dependabot to update npm dependencies.
  - package-ecosystem: "npm"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR per group below; majors are kept apart so a breaking release
    # does not block the safe minor/patch bumps (see /dependabot-update).
    open-pull-requests-limit: 3
    versioning-strategy: increase
    commit-message:
      prefix: "[yarn]"
    assignees:
      - "vitalii-pustovyi"
    groups:
      # A package goes to the first group it matches.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      e2e-tooling-major:
        update-types:
          - "major"
        patterns:
          - "@wdio/*"
          - "webdriverio"
          - "expect-webdriverio"
          - "eslint-plugin-wdio"
          - "geckodriver"
          - "chromedriver"
          - "@cucumber/*"
      major:
        update-types:
          - "major"
    ignore:
      - dependency-name: "@icp-sdk/core"
      - dependency-name: "@icp-sdk/auth"

  # This section configures Dependabot to update GitHub Actions dependencies.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "[github-actions]"
    assignees:
      - "olsemeno"
    groups:
      dependencies:
        patterns:
          - "*"

  # This section configures Dependabot to update Docker dependencies.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "[docker]"
    assignees:
      - "olsemeno"
    groups:
      dependencies:
        patterns:
          - "*"
